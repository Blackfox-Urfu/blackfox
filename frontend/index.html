<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blackfox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #181818; /* Темный фон для всего тела */
            color: #e0e0e0; /* Светлый текст для контраста */
            transition: background-color 0.3s, color 0.3s;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 97vh;
            padding: 45px;
            max-width: 600px;
            margin: auto;
            background-color: #2c2f36; /* Темный фон для контейнера */
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #f8f8f8; /* Светлый цвет заголовка */
            margin-bottom: 20px;
        }

        #chatView {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 20px;
            padding: 10px;
        }

        .message-container {
            display: flex;
            align-items: flex-start;
            margin: 10px 0;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 70%;
            word-wrap: break-word;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            background-color: #6a1b9a; /* Фиолетовый цвет для всех сообщений */
            color: white; /* Белый текст */
        }

        .sender-message-container {
            justify-content: flex-end;
        }

        .sender-message-bubble {
            background-color: #007bff;
            color: white;
        }

        #channelInput, #numPostsInput {
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 25px;
            border: 1px solid #555; /* Темная рамка */
            font-size: 14px;
            width: 100%;
            background-color: #444; /* Темный фон для полей ввода */
            color: #fff; /* Светлый цвет текста в полях */
        }

        #fetchButton {
            background-color: #007bff;
            border-radius: 25px;
            outline: none;
            border: none;
            padding: 12px 20px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        #fetchButton:hover {
            background-color: #0056b3;
        }

        #progressContainer {
            display: none;
            margin-top: 20px;
        }

        #progressText {
            margin-bottom: 5px;
            color: #fff; /* Белый текст для прогресса */
        }

        progress {
            width: 100%;
            height: 20px;
            background-color: #555; /* Темный фон прогресса */
        }

        progress[value] {
            background-color: #444; /* Немного темнее фон для прогресса */
        }

        .message img, .message video {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>blackfox</h1>

        <!-- Input for channel name -->
        <label for="channelInput" style="color: #ccc;">Channel Name:</label>
        <input id="channelInput" type="text" placeholder="Enter channel name">

        <!-- Input for the number of posts -->
        <label for="numPostsInput" style="color: #ccc;">Number of Posts:</label>
        <input id="numPostsInput" type="number" placeholder="Number of posts">

        <!-- Button to start the fetch process -->
        <button id="fetchButton">Fetch Messages</button>

        <!-- Container for progress bar -->
        <div id="progressContainer" class="progress-bar-container">
            <p id="progressText">Progress: 0%</p>
            <progress id="progressBar" value="0" max="100"></progress>
        </div>

        <!-- Container to display fetched messages -->
        <div id="chatView"></div>
    </div>

    <!-- Подключение скрипта -->
    <script>
        console.log("renderer.js подключен и выполняется!");

        document.getElementById('fetchButton').addEventListener('click', async () => {
            const channel = document.getElementById('channelInput').value.trim();
            const numPosts = parseInt(document.getElementById('numPostsInput').value);

            // Проверка на пустые или некорректные значения
            if (!channel) {
                alert('Please enter a channel name.');
                return;
            }

            if (!numPosts || numPosts <= 0) {
                alert('Please enter a valid number of posts.');
                return;
            }

            console.log(`Запрос на канал: ${channel}, Количество постов: ${numPosts}`);

            try {
                // Установка WebSocket соединения
                const ws = new WebSocket("ws://127.0.0.1:5000/progress");

                ws.onopen = () => {
                    console.log("WebSocket соединение открыто.");
                    // Отправка данных через WebSocket
                    ws.send(JSON.stringify({ channel: channel, num_posts: numPosts }));
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log("Получено сообщение от сервера:", data);

                        // Обработка статусов
                        switch (data.status) {
                            case "in_progress":
                                const progressContainer = document.getElementById("progressContainer");
                                const progressBar = document.getElementById("progressBar");
                                const progressText = document.getElementById("progressText");

                                progressContainer.style.display = "block";
                                progressBar.value = data.progress;
                                progressText.innerText = `Progress: ${data.progress.toFixed(2)}%`;
                                break;

                            case "done":
                                console.log("Загрузка завершена!");
                                document.getElementById("progressText").innerText = "Загрузка завершена!";

                                const chatView = document.getElementById("chatView");
                                chatView.innerHTML = ""; // Очищаем контейнер перед добавлением новых сообщений

                                data.messages.forEach(message => {
                                    const messageElement = document.createElement("div");
                                    messageElement.classList.add("message-container");

                                    const messageText = message.text || "";
                                    const mediaPath = message.media ? message.media.path : null;

                                    // Формирование HTML
                                    let mediaHTML = mediaPath 
                                        ? `<p><img src="${mediaPath}" alt="media" style="max-width: 300px;"></p>` 
                                        : "";

                                    messageElement.innerHTML = `
                                        <div class="message-bubble">
                                            <p>${message.id}</p>
                                            <p>${message.date}</p>
                                            <p>${messageText}</p>
                                            ${mediaHTML}
                                        </div>
                                    `;

                                    chatView.appendChild(messageElement);
                                });
                                ws.close();
                                break;

                            case "error":
                                console.error("Ошибка:", data.message);
                                alert(`Ошибка: ${data.message}`);
                                ws.close();
                                break;

                            default:
                                console.error("Неизвестный статус:", data.status);
                        }
                    } catch (error) {
                        console.error("Ошибка при обработке данных от WebSocket:", error);
                        alert("Произошла ошибка при получении данных. Пожалуйста, попробуйте снова.");
                    }
                };

                ws.onclose = () => {
                    console.log("WebSocket соединение закрыто.");
                };

                ws.onerror = (error) => {
                    console.error("Ошибка WebSocket:", error);
                    alert('Произошла ошибка WebSocket. Проверьте подключение к серверу.');
                };
            } catch (error) {
                console.error('Произошла ошибка при запросе или обработке данных:', error);
                alert('Ошибка при запросе данных. Пожалуйста, попробуйте снова.');
            }
        });
    </script>
</body>
</html>
